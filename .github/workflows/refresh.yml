name: Refresh data from the sources

# Downloads everything again (Eurostat, UN Comtrade, WITS), rebuilds the warehouse, runs every data check
# and uploads the new dashboard data for review. Manual on purpose: the Comtrade public API is rate limited.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m apparel all
      - uses: actions/upload-artifact@v4
        with:
          name: apparel-json
          path: dashboard/data/apparel.json
