[project]
name = "bd-apparel-after-ldc"
version = "1.0.0"
description = "Where should Bangladeshi apparel compete after LDC graduation? Market shares, prices, tariff exposure and EU access scenarios from Eurostat, UN Comtrade and WITS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.44"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
